services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: manhwa
      POSTGRES_USER: manhwa
      POSTGRES_PASSWORD: manhwa
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
